[package]
name = "collector"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1"
pcap-file = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
multihash = "0.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "ansi", "std"] }
signal-hook = "0.3"
libc = "0.2"
object_store = { version = "0.14", features = ["aws"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
parquet = { version = "60", default-features = false, features = ["zstd"] }
zstd = "0.14"
flate2 = "1"
brotli = "9"

[dev-dependencies]
futures = "0.3"
bytes = "1"
tempfile = "3"
