[package]
name = "collector"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1"
pcap-file = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
multihash = "0.19"

[dev-dependencies]
tempfile = "3"
