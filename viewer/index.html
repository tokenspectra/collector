async function fillBody(slot) {
  const h = slot.dataset.hash, ct = slot.dataset.ct, proto = slot.dataset.proto || null;
  const { wire, plain, msg, error } = await readPlain(h);
  if (!wire) { slot.innerHTML = `<p class="muted">Not in the folder (bodies/ missing, or run with --no-bodies).</p>`; return; }
  const bytesArr = plain || wire;
  const text = plain ? utf8.decode(bytesArr) : "";
  const binary = !plain || /[\x00-\x08\x0e-\x1f]/.test(text.slice(0, 4096));
  const framing = binary ? "text" : framingOf(text, ct);
  const tabs = [];
  if (framing === "sse" || framing === "ndjson") {
    const r = readResponse(text, ct, proto);
    tabs.push(["merged", `<p class="note">Derived view: ${esc(responseSummary(r))}. Not evidence; the raw body is.</p>` + responseHtml(r)]);
    tabs.push([framing === "sse" ? "events" : "lines", `<table><tr><th class="num">#</th><th>data</th></tr>${r.frames.slice(0, 2000).map((e, i) =>
      `<tr><td class="num">${i}</td><td class="mono">${esc(clip(e.data))}</td></tr>`).join("")}</table>`]);
  }
  if (framing === "json") tabs.push(["json", `<pre class="body">${esc(JSON.stringify(JSON.parse(text), null, 2))}</pre>`]);
  if (plain || !msg) tabs.push([binary ? "hex" : msg ? "decoded" : "raw", `<pre class="body">${binary ? hexdump(bytesArr) : esc(text)}</pre>`]);
  if (msg) tabs.push([`wire (${msg.content_encoding})`, (error ? `<p class="muted">${esc(error)}</p>` : "") + `<pre class="body">${hexdump(wire)}</pre>`]);
  const id = "b" + Math.random().toString(36).slice(2);
  slot.innerHTML = `<div class="tabs">${tabs.map(([n], i) => `<button class="${i ? "" : "on"}" data-act="tab" data-g="${id}" data-i="${i}">${n}</button>`).join("")}
      <span style="flex:1"></span><button data-act="verify" data-hash="${h}">Verify BLAKE3</button> <span class="vout"></span>
      ${plain && msg ? `<button data-act="verify-decoded" data-hash="${h}">Verify decoded BLAKE3</button> <span class="vout"></span>` : ""}</div>` +
    tabs.map(([, body], i) => `<div class="tabp" data-g="${id}" data-i="${i}" ${i ? "hidden" : ""}>${body}</div>`).join("") +
    `<p class="note">${bytes(wire.length)}${msg ? ` on the wire, ${esc(msg.content_encoding)}` + (plain ? ` → ${bytes(plain.length)} decoded` : "") : ""} · bodies/${esc(h)}</p>`;
}
function hexdump(b) {
  let out = "";
  for (let i = 0; i < Math.min(b.length, 16384); i += 16) {
    const row = b.slice(i, i + 16);
    out += i.toString(16).padStart(8, "0") + "  " + Array.from(row, x => x.toString(16).padStart(2, "0")).join(" ").padEnd(48) +
      "  " + Array.from(row, x => x >= 32 && x < 127 ? String.fromCharCode(x) : ".").join("") + "\n";
  }
  return esc(out);
}

// Turns of a raw templated prompt (e.g. llama.cpp /completion): Gemma-style <|turn>role ... <turn|>,
// ChatML <|im_start|>role ... <|im_end|>, Llama-3 <|start_header_id|>role<|end_header_id|> ... <|eot_id|>.
function promptTurns(p) {
  const pats = [
    /<\|turn>(\w+)\n([\s\S]*?)(?:<turn\|>|$)/g,
    /<\|im_start\|>(\w+)\n([\s\S]*?)(?:<\|im_end\|>|$)/g,
    /<\|start_header_id\|>(\w+)<\|end_header_id\|>\n*([\s\S]*?)(?:<\|eot_id\|>|$)/g,
  ];
  for (const re of pats) {
    const turns = [...p.matchAll(re)].map(m => ({ role: m[1], text: m[2].trim() })).filter(t => t.text);
    if (turns.length) return turns;
  }
  return [{ role: "prompt", text: p }];
}
// Split model "thinking" channels out of generated text.
function splitThought(text) {
  let reasoning = "";
  const content = text.replace(/<\|channel>(?:thought|analysis)?\n?([\s\S]*?)(?:<channel\|>|$)/g, (_, r) => { reasoning += r; return ""; })
    .replace(/<think>([\s\S]*?)(?:<\/think>|$)/g, (_, r) => { reasoning += r; return ""; });
  return { content: content.trim(), reasoning: reasoning.trim() };
}
// A long system prompt starts folded, so the turns stay readable.
function bubble(role, text, extra = "") {
  const cls = role === "user" ? "user" : role === "assistant" || role === "model" ? "asst" : "";
  if (role === "system" && text.length > 1500)
    return `<details class="msg"><summary class="role">${esc(role)}${extra} (${num(text.length)} chars)</summary><pre>${esc(text)}</pre></details>`;
  return `<div class="msg ${cls}"><div class="role">${esc(role)}${extra}</div><pre>${esc(text)}</pre></div>`;
}

async function fillConvo(el) {
  const { req: rh, resp: ph, ct = "", proto = "", endpoint = "" } = el.dataset;
  const [rq, rs] = await Promise.all([readPlain(rh), ph ? readPlain(ph) : null]);
  if (!rq.wire) { el.innerHTML = `<p class="muted">Request body not in the folder.</p>`; return; }
  if (!rq.plain || (rs && !rs.plain)) { el.innerHTML = `<p class="muted">Coded body ${esc((rq.error || rs?.error) ?? "missing")}.</p>`; return; }
  const req = rq.plain, resp = rs?.plain;
  let html = "";
  try {
    for (const t of requestTurns(JSON.parse(utf8.decode(req)), endpoint)) {
      if (t.reasoning) html += `<details class="msg"><summary class="role">${esc(t.role)} · reasoning (${num(t.reasoning.length)} chars)</summary><pre>${esc(t.reasoning)}</pre></details>`;
      if (t.text) html += bubble(t.role, t.text);
    }
  } catch { html += `<p class="muted">Request body is not JSON.</p>`; }
  if (!resp) { el.innerHTML = html + `<p class="muted">No response body.</p>`; return; }
  const r = readResponse(utf8.decode(resp), ct, proto || null);
  html += `<p class="note">${esc(responseSummary(r))}</p>` + responseHtml(r);
  el.innerHTML = html;
}

function hydrate(root) {
  root.querySelectorAll(".bodyslot").forEach(fillBody);
  root.querySelectorAll(".convo").forEach(fillConvo);
  for (const id in CHARTS) if (!document.getElementById(id)) delete CHARTS[id];
  for (const id in PAGES) if (document.getElementById(id)) { if (!PAGES[id].shown) morePackets(id); } else delete PAGES[id];
}

document.addEventListener("click", async e => {
  const act = e.target.closest("[data-act]");
  if (act) {
    const d = act.dataset;
    if (d.act === "more") morePackets(d.t);
    if (d.act === "mode") {
      chartMode = d.m;
      document.querySelectorAll(".stack").forEach(box => {
        if (!CHARTS[box.id]) return;
        box.querySelector(".stack-plot").innerHTML = chartSvg(box.id);
        box.querySelectorAll('[data-act="mode"]').forEach(b => b.classList.toggle("on", b.dataset.m === chartMode));
      });
    }
    if (d.act === "tab") {
      document.querySelectorAll(`[data-g="${d.g}"]`).forEach(x => {
        if (x.classList.contains("tabp")) x.hidden = x.dataset.i !== d.i; else x.classList.toggle("on", x.dataset.i === d.i);
      });
    }
    if (d.act === "verify") {
      const out = act.nextElementSibling;
      const b = await readBody(d.hash);
      const got = B3.mh(b);
      out.innerHTML = got === d.hash ? pill("matches its name", "ok") : pill("mismatch", "bad") + " got " + hash(got, true);
    }
    if (d.act === "verify-decoded") {
      const out = act.nextElementSibling, { plain, msg } = await readPlain(d.hash);
      const got = B3.mh(plain);
      out.innerHTML = got === msg.decoded_hash ? pill("matches decoded_hash", "ok") : pill("mismatch", "bad") + " got " + hash(got, true);
    }
    if (d.act === "merkle") {
      const pk = (D.packetsByLw.get(d.lw) || []).slice().sort((x, y) => x.index - y.index);
      const c = D.chunkByLw.get(d.lw);
      const got = merkleRoot(pk.map(p => p.hash));
      document.getElementById("merkle-out").innerHTML = got === c.merkle_root
        ? pill(`matches (${pk.length} packet hashes)`, "ok") : pill("mismatch", "bad") + " got " + hash(got, true);
    }
    if (d.act === "record") {
      const w = D.wuById.get(d.wu), rec = D.blobByWu.get(d.wu);
      const got = B3.mh(new TextEncoder().encode(w._raw));
      document.getElementById("rec-out").innerHTML = got === rec.hash ? pill("row JSON matches blob hash", "ok") : pill("mismatch", "bad") + " got " + hash(got, true);
    }
    return;
  }
  if (e.target.closest("a, .hash")) return;
  const tr = e.target.closest("[data-href]");
  if (tr) go(tr.dataset.href);
});

/* ===================== Tree ===================== */
// Lazily built: each node has {label, href, kind, count, kids: () => [...]}
function treeRoot() {
  return {
    label: D.name, href: R.home(), kind: "cap", open: true,
    kids: () => [
      ...D.links.map(l => ({
        label: l, href: R.link(l), kind: "link", open: true,
        kids: () => [
          { label: "Flows", href: R.flows(l), kind: "", count: [...D.flowsById.values()].filter(f => f.link === l).length,
            kids: () => [...D.flowsById.values()].filter(f => f.link === l).sort((x, y) => y.wire - x.wire).map(flowNode) },
          { label: "Windows", href: R.link(l), kind: "", count: D.windows.length,
            kids: () => D.windows.filter(ws => D.chunkByLw.has(l + "@" + ws) || (D.slicesByWs.get(ws) || []).some(s => s.link === l)).map(ws => ({
              label: wsLabel(ws), href: R.window(l, ws), kind: "win", count: (D.slicesByWs.get(ws) || []).filter(s => s.link === l).length,
              kids: () => (D.slicesByWs.get(ws) || []).filter(s => s.link === l).map(s => ({
                label: flowLabel(s.flow), href: R.slice(s.flow, ws), kind: "slice" })) })) },
        ],
      })),
      { label: "Request Workunits", href: R.workunits(), kind: "", count: D.workunits.length,
        kids: () => D.workunits.map(w => wuNode(w)) },
      { label: "Bodies", href: R.bodies(), kind: "", count: D.bodyHashes.length,
        kids: () => D.bodyHashes.map(h => ({ label: mhShort(h), href: R.body(h), kind: "body" })) },
      { label: "Events", href: R.events(), kind: "", count: D.events.length },
    ],
  };
}
function flowNode(f) {
  return {
    label: flowLabel(f), href: R.flow(f.id), kind: "flow", count: f.workunits ? `${f.workunits} WU` : "",
    kids: () => [
      ...f.exchanges.map(h => ({
        label: exLabel(h), href: R.exchange(h.flow, h.exchange), kind: "http",
        kids: h.workunit_id && D.wuById.has(h.workunit_id) ? () => [wuNode(D.wuById.get(h.workunit_id))] : bodyKids(h),
        count: isChat(h) ? "chat" : "",
      })),
      ...f.slices.map(s => ({ label: "Slice " + wsLabel(s.window_start_ns), href: R.slice(f.id, s.window_start_ns), kind: "slice",
        count: s.orig_stats.packets + s.resp_stats.packets })),
    ],
  };
}
function bodyKids(h) {
  const k = [];
  if (isChat(h)) k.push({ label: "conversation", href: R.convo(h.flow, h.exchange), kind: "chat" });
  if (h.request?.body_hash && h.request.body_len) k.push({ label: "request body", href: R.body(h.request.body_hash), kind: "body" });
  if (h.response?.body_hash && h.response.body_len) k.push({ label: "response body", href: R.body(h.response.body_hash), kind: "body" });
  return k.length ? () => k : null;
}
function wuNode(w) {
  return {
    label: `${w.model} ${w.endpoint}`, href: R.workunit(w.workunit_id), kind: "wu",
    kids: () => [
      { label: "conversation", href: R.convo(w.flow, w.exchange), kind: "chat" },
      { label: "request body", href: R.body(w.request_body_hash), kind: "body" },
      { label: "response body", href: R.body(w.response_body_hash), kind: "body" },
    ],
  };
}

function renderNode(n, depth) {
  const el = document.createElement("div");
  el.className = "node";
  el.innerHTML = `<div class="row" style="--d:${depth}" data-node-href="${n.href}"><span class="tw">${n.kids ? (n.open ? "▾" : "▸") : ""}</span>
    ${n.kind ? `<span class="kind">${esc(n.kind)}</span>` : ""}<span class="lbl" title="${esc(n.label.replace(/<[^>]+>/g, ""))}">${n.label}</span>
    ${n.count !== undefined && n.count !== "" ? `<span class="cnt">${n.count}</span>` : ""}</div><div class="kids"></div>`;
  const row = el.firstElementChild, kidsEl = el.lastElementChild, tw = row.querySelector(".tw");
  let built = false;
  const toggle = open => {
    n.open = open;
    tw.textContent = n.kids ? (open ? "▾" : "▸") : "";
    if (open && !built && n.kids) { for (const k of n.kids()) kidsEl.appendChild(renderNode(k, depth + 1)); built = true; }
    kidsEl.hidden = !open;
  };
  row.addEventListener("click", e => {
    if (e.target === tw) { toggle(!n.open); return; }
    if (n.kids && !n.open) toggle(true);
    go(n.href);
  });
  el._toggle = toggle;
  el._node = n;
  toggle(!!n.open);
  return el;
}
function buildTree() {
  const t = document.getElementById("tree");
  t.innerHTML = "";
  t.appendChild(renderNode(treeRoot(), 0));
}
function syncTree(h) {
  const rows = document.querySelectorAll("#tree .row");
  let hit = null;
  rows.forEach(r => { const on = r.dataset.nodeHref === h; r.classList.toggle("sel", on); if (on && !hit) hit = r; });
  if (hit) hit.scrollIntoView({ block: "nearest" });
}

/* ===================== Wiring ===================== */
document.getElementById("pick").addEventListener("change", e => loadFileList(e.target.files));
const drop = document.getElementById("drop");
document.addEventListener("dragover", e => { e.preventDefault(); drop?.classList.add("over"); });
document.addEventListener("dragleave", () => drop?.classList.remove("over"));
document.addEventListener("drop", async e => {
  e.preventDefault();
  drop?.classList.remove("over");
  const items = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry?.()).filter(Boolean);
  const dir = items.find(i => i.isDirectory);
  if (!dir) return alert("Drop a folder.");
  const out = new Map();
  const reader = dir.createReader();
  let batch;
  do {
    batch = await new Promise((res, rej) => reader.readEntries(res, rej));
    for (const ent of batch) await readDropped(ent, "", out);
  } while (batch.length);
  await loadFiles(out, dir.name);
});
</script>
