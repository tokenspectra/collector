name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    # tests/s3.rs runs the S3 backend against VersityGW, an S3-compatible
    # gateway over a local directory (MinIO no longer publishes images).
    env:
      TS_S3_TEST_URL: s3://collector-test
      AWS_ACCESS_KEY_ID: collector
      AWS_SECRET_ACCESS_KEY: collector-secret
      AWS_REGION: us-east-1
      AWS_ENDPOINT: http://127.0.0.1:7070
      AWS_ALLOW_HTTP: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          # Set by hand: Dependabot moves the action's SHA, not this input.
          toolchain: "1.99.1"
          components: rustfmt, clippy
          targets: thumbv7em-none-eabi, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      # The trusted core has to build where there is no std, and for the
      # Console in the browser.
      - run: cargo build -p commit --target thumbv7em-none-eabi
      - run: cargo build -p commit --target wasm32-unknown-unknown
      # A bucket of the posix backend is a top-level directory.
      - name: Start VersityGW
        run: |
          mkdir -p "$RUNNER_TEMP/s3/collector-test"
          chmod -R 777 "$RUNNER_TEMP/s3"
          docker run -d --name s3 -p 7070:7070 -v "$RUNNER_TEMP/s3:/data" \
            -e ROOT_ACCESS_KEY="$AWS_ACCESS_KEY_ID" -e ROOT_SECRET_KEY="$AWS_SECRET_ACCESS_KEY" \
            versity/versitygw:v1.10.0@sha256:2df780de109d16491cb99c25f4c0bc9085b286e77b5b47b56121b340094e70bb \
            --port :7070 posix /data
          for _ in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:7070/ && exit 0; sleep 1; done
          docker logs s3; exit 1
      - run: cargo test --workspace
      # The viewer has no build; this runs its body rendering in Node with a stub DOM.
      - run: node viewer/check.mjs

  # Reports how much production code the PR touches: files under `src/`,
  # source extensions only, test files and inline `#[cfg(test)]` modules
  # stripped out (scripts/pr-diff-stats.py, from overfolder/overslash).
  # `git diff --shortstat` is useless here: one captured fixture brings its
  # golden tables along and dwarfs a real change.
  #
  # Informational only: a reporter must never block a merge. If the script
  # breaks, the job still shows a red X in the PR's checks.
  diff-stats:
    name: PR diff size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The sticky comment needs write; scoped to this job.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The script diffs against the merge-base, so it needs real history.
          fetch-depth: 0
      # A PR that touches no `src/` file exercises only the empty path; this
      # runs the whole pipeline over a synthetic repo with known counts.
      - name: Self-test
        run: ./scripts/pr-diff-stats.py --self-test
      - name: Measure code diff
        id: stats
        run: |
          ./scripts/pr-diff-stats.py \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            --out pr-diff-stats.md
          cat pr-diff-stats.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'markdown<<PR_DIFF_STATS_EOF'
            cat pr-diff-stats.md
            echo 'PR_DIFF_STATS_EOF'
          } >> "$GITHUB_OUTPUT"
      # The step summary already carries the number, so a fork PR (read-only
      # token, this step fails) still reports it.
      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: diff-stats
          message: ${{ steps.stats.outputs.markdown }}
