# Scans Cargo.lock against OSV, at every severity. Ignores live in
# osv-scanner.toml.
#
# Gating PRs on changed paths rather than running this on every PR is
# deliberate: a new advisory against an unchanged lockfile must not block
# unrelated merges. The daily schedule catches those; a scheduled failure
# stays a failed run.
name: Dependency audit

on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "osv-scanner.toml"
      - ".github/workflows/deps-audit.yml"
  schedule:
    # 06:17 UTC: off the top of the hour, when scheduled runs queue longest.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-scan:
    name: OSV scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Lockfiles are listed explicitly rather than with --recursive, so a
      # fixture lockfile never joins the scan.
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=Cargo.lock
